name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check Apple tools
        run: |
          xcodebuild -version
          pod --version
      - name: Install dependencies and build mobile bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile
      - name: Archive for iPhone without signing
        run: |
          set -euo pipefail
          VER="$(node -p "require('./frontend/package.json').version")"
          BUILD="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' frontend/android/app/build.gradle | head -1)"
          test -n "$BUILD"
          mkdir -p build
          xcodebuild -workspace frontend/ios/App/App.xcworkspace \
            -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > build/xcodebuild.log 2>&1 || { tail -100 build/xcodebuild.log; exit 1; }
          tail -30 build/xcodebuild.log
      - name: Package and verify IPA
        run: |
          set -euo pipefail
          VER="$(node -p "require('./frontend/package.json').version")"
          mkdir -p build/Payload artifacts
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          APP=build/Payload/App.app
          plutil -lint "$APP/Info.plist"
          test -s "$APP/public/index.html"
          lipo -verify_arch arm64 "$APP/App"
          file "$APP/App"
          (cd build && zip -qry "../artifacts/openGym-$VER-unsigned.ipa" Payload)
          unzip -t "artifacts/openGym-$VER-unsigned.ipa" | tail -1
          (cd artifacts && shasum -a 256 "openGym-$VER-unsigned.ipa" > "openGym-$VER-unsigned.ipa.sha256")
          git rev-parse HEAD > artifacts/source-commit.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openGym-unsigned-ipa
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
